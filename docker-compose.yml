version: '3.8'

services:
  db:
    image: mariadb:11
    restart: always
    environment:
      # Credenciales idénticas a las locales pero internalizadas en docker
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: DemoRF
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ejecutamos con el user de Linux para evitar errores de "Permission Denied" al escribir en el host
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      # Red interna: conectarse usando el nombre del servicio 'db' y en el puerto interno 3306
      - DATABASE_URL=mysql://root:admin123@db:3306/DemoRF
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5173:5173"
    environment:
      # Activa hot reload a través de montajes en entornos Linux/Docker
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  db_data:
